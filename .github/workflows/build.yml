name: Build patches

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # ReVanced Patcher and its Gradle plugin come from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Check scripts
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          python3 -m py_compile services/primevideo/scripts/apply_smali_patch.py

      - uses: actions/upload-artifact@v4
        with:
          name: patches
          path: patches/build/libs/*.rvp
